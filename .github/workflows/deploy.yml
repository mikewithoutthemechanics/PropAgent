name: Deploy to Vercel

on:
  push:
    branches: [ main, master, 006-communication-platform ]
  pull_request:
    branches: [ main, master, 006-communication-platform ]

defaults:
  run:
    working-directory: ./propagent-web

defaults:
  run:
    working-directory: ./propagent-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./propagent-web/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./propagent-web
          vercel-args: '--prod'
